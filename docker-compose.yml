services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # These three define the database docker's `postgres` image creates on
      # first boot. They must match the credentials/db-name encoded in the
      # DATABASE_URL that `web` uses to connect (see .env).
      POSTGRES_USER: securescan
      POSTGRES_PASSWORD: securescan
      POSTGRES_DB: securescan
    volumes:
      # Named volume so data survives `docker-compose down` (only
      # `down -v` wipes it). Without this, every container recreation
      # would start from a completely empty database.
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed to the host mainly so you can inspect the DB with a GUI
      # tool (DBeaver, pgAdmin, TablePlus) from Windows while developing.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securescan"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    # Mounting the source as a volume gives hot-reload: Django's
    # StatReloader picks up file changes on your Windows filesystem
    # immediately, without rebuilding the image.
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
